<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insiderFun</title>
<meta name="description" content="B站 2025 百大UP主全名单，按个人兴趣匹配度与内容类型分类，可直接播放代表作。">
<meta name="referrer" content="no-referrer-when-downgrade">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3240; --text:#e6edf3; --muted:#8b97a7;
  --accent:#ff6699; --accent2:#4fc3f7; --t1:#3fb950; --t2:#d29922; --t3:#6e7681; --warn:#f0883e;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --line:#d8dee4; --text:#1f2328; --muted:#59636e;
  --accent:#e0457b; --accent2:#0969da; --t1:#1a7f37; --t2:#9a6700; --t3:#6e7781; --warn:#bc4c00;}}
:root[data-theme="light"]{
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --line:#d8dee4; --text:#1f2328; --muted:#59636e;
  --accent:#e0457b; --accent2:#0969da; --t1:#1a7f37; --t2:#9a6700; --t3:#6e7781; --warn:#bc4c00;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif}
a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo b{color:var(--accent)} .logo span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:5px 12px;color:var(--muted)}
nav.tabs button.on{border-color:var(--line);background:var(--panel);color:var(--text)}
.search{flex:1;min-width:180px;display:flex}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
#theme{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.wrap{max-width:1320px;margin:0 auto;padding:16px;display:grid;grid-template-columns:230px 1fr;gap:20px}
aside{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;padding-right:4px}
aside h4{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:7px;padding:5px 8px;text-align:left;color:var(--text)}
.chip:hover{background:var(--panel)} .chip.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:4px 8px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;width:100%}
main{min-width:0}
.note{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.note b{color:var(--text)}
/* player */
#player{display:none;margin-bottom:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
#player.show{display:grid;grid-template-columns:1fr 320px}
.screen{position:relative;aspect-ratio:16/9;background:#000}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.plist{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;max-height:100%}
.plist .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
.plist .hd .who{font-weight:700} .plist .hd .meta{font-size:12px;color:var(--muted)}
.plist ol{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.plist li button{width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text)}
.plist li button:hover{background:var(--panel2)} .plist li button.on{background:var(--panel2);color:var(--accent)}
.plist .ft{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
/* sections */
h2.sec{font-size:17px;margin:4px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec small{color:var(--muted);font-weight:400;font-size:13px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:28px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.vcard:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/9;padding:12px;display:flex;align-items:flex-end;font-weight:700;font-size:15px;line-height:1.35;color:#fff;position:relative}
.thumb::after{content:"▶";position:absolute;top:10px;right:12px;font-size:13px;opacity:.85;background:rgba(0,0,0,.35);border-radius:999px;width:26px;height:26px;display:grid;place-items:center}
.vcard .by{padding:8px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.ucard .top{display:flex;gap:12px;align-items:center}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px}
.uname{font-weight:700;word-break:break-all}
.sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fans{font-family:var(--mono);color:var(--text)}
.fans.est{color:var(--muted)}
.tier{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid}
.tier.t1{color:var(--t1);border-color:var(--t1)} .tier.t2{color:var(--t2);border-color:var(--t2)} .tier.t3{color:var(--t3);border-color:var(--t3)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted)}
.unv{font-size:11px;color:var(--warn)}
.why{font-size:13.5px;margin:0}
.acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.empty{color:var(--muted);padding:30px;text-align:center}
.ext .ucard .sub a{font-size:12px}
footer{max-width:1320px;margin:20px auto 40px;padding:0 16px;color:var(--muted);font-size:12.5px}
#mfilters{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  #mfilters{display:inline-block}
  #player.show{grid-template-columns:1fr}
  .plist{border-left:0;border-top:1px solid var(--line);max-height:300px}
  .logo span{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><b>insider</b>Fun<span>// B站百大 · 按你的口味分好了</span></div>
    <nav class="tabs" id="tabs">
      <button data-v="videos" class="on">精选视频</button>
      <button data-v="ups">百大全名单</button>
      <button data-v="ext">站外推荐</button>
    </nav>
    <div class="search"><input id="q" type="search" placeholder="搜 UP主 / 类型 / 视频标题…"></div>
    <button id="mfilters" class="btn">筛选</button>
    <button id="theme" title="切换明暗">◐</button>
  </div>
</header>

<div class="wrap">
  <aside id="side">
    <h4>兴趣匹配度</h4>
    <div class="chips" id="tierChips"></div>
    <h4>内容类型</h4>
    <div class="chips" id="typeChips"></div>
    <h4>排序</h4>
    <div style="padding:0 8px"><select id="sort">
      <option value="tier">按匹配度</option>
      <option value="fans">按粉丝数</option>
      <option value="rank">按名单顺序</option>
    </select></div>
    <label class="opt"><input type="checkbox" id="hideUnv"> 隐藏"分类待核实"</label>
  </aside>

  <main>
    <section id="player">
      <div class="screen"><iframe id="frame" title="Bilibili player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="plist">
        <div class="hd"><div class="who" id="pWho"></div><div class="meta" id="pMeta"></div></div>
        <ol id="pList"></ol>
        <div class="ft"><a class="btn" id="pSpace" target="_blank" rel="noopener">B站主页 ↗</a><a class="btn" id="pOpen" target="_blank" rel="noopener">在B站打开本集 ↗</a><button class="btn" id="pClose">收起</button></div>
      </div>
    </section>

    <div class="note" id="intro"></div>
    <section id="view"></section>
  </main>
</div>

<footer>
  名单来源：哔哩哔哩 2025 年度百大UP主（2026-01-18 发布）。视频通过 B 站官方外链播放器嵌入，版权归原作者。
  粉丝数：标"实时"的为本页从 B 站接口实时读取；标"≈"的为估算或带日期的快照，以 B 站主页为准。
  "分类待核实"表示该UP主的内容方向尚未逐一确认。
</footer>

<script src="data.js"></script>
<script>
(function(){
const UPS = window.UPS, EXT = window.EXT;
const TIERS = {1:{name:'强烈推荐',hint:'深度/专业/干货，和你的口味高度重合',color:'var(--t1)'},
               2:{name:'可以看看',hint:'有质量或部分对口，按兴趣挑',color:'var(--t2)'},
               3:{name:'大概率不对口',hint:'游戏、娱乐、二次元等',color:'var(--t3)'}};
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const state = Object.assign({view:'videos', tiers:new Set([1]), type:null, q:'', sort:'tier', hideUnv:false}, {});
const saved = store.get('if_state');
if(saved){ state.view=saved.view||state.view; state.tiers=new Set(saved.tiers||[1]); state.type=saved.type||null; state.sort=saved.sort||'tier'; state.hideUnv=!!saved.hideUnv; }
const persist=()=>store.set('if_state',{view:state.view,tiers:[...state.tiers],type:state.type,sort:state.sort,hideUnv:state.hideUnv});

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hue(s){let h=0;for(const ch of s)h=(h*31+ch.codePointAt(0))%360;return h}
const grad=s=>{const h=hue(s);return `linear-gradient(135deg,hsl(${h} 55% 32%),hsl(${(h+40)%360} 60% 22%))`};
const initial=n=>{const m=n.replace(/^[-_\s]+/,'');return esc([...m][0]||'?').toUpperCase()};
const spaceUrl=u=>u.mid?`https://space.bilibili.com/${u.mid}`:`https://search.bilibili.com/upuser?keyword=${encodeURIComponent(u.n)}`;

/* ---------- live follower counts (JSONP, best effort) ---------- */
const live = store.get('if_fans') || {};
const FRESH = 12*3600*1000;
function fmt(n){ if(n==null) return null; if(n>=1e8) return (n/1e8).toFixed(2)+'亿'; if(n>=1e4) return (n/1e4).toFixed(n>=1e6?0:1)+'万'; return String(n); }
function fansHTML(u){
  const L = live[u.mid];
  if(L && L.f!=null) return `<span class="fans" title="B站实时数据（${new Date(L.t).toLocaleString()}）">${fmt(L.f)} 粉丝 · 实时</span>`;
  if(u.f){ const ver=u.fs.startsWith('v:'); return `<span class="fans est" title="${ver?'快照：'+esc(u.fs.slice(2)):'估算值，以B站主页为准'}">≈${fmt(u.f)} 粉丝${ver?'':'（估）'}</span>`; }
  return `<a class="fans est" href="${spaceUrl(u)}" target="_blank" rel="noopener">粉丝数 → 主页查看</a>`;
}
let jsonpBroken = false, inflight = 0; const queue=[];
function fetchFans(mid){
  if(!mid || jsonpBroken) return;
  const L=live[mid]; if(L && Date.now()-L.t<FRESH) return;
  if(queue.includes(mid)) return; queue.push(mid); pump();
}
function pump(){
  while(inflight<3 && queue.length && !jsonpBroken){
    const mid=queue.shift(); inflight++;
    const cb='__if_'+mid+'_'+Math.floor(Math.random()*1e6);
    const s=document.createElement('script'); let done=false;
    const fin=ok=>{ if(done) return; done=true; inflight--; delete window[cb]; s.remove(); if(!ok){ fails++; if(fails>=4 && !succ) jsonpBroken=true; } pump(); };
    window[cb]=d=>{ if(d && d.code===0 && d.data){ live[mid]={f:d.data.follower,t:Date.now()}; succ++; store.set('if_fans',live); document.querySelectorAll(`[data-fans="${mid}"]`).forEach(el=>{const u=UPS.find(x=>x.mid===mid); el.innerHTML=fansHTML(u);}); fin(true);} else fin(false); };
    s.src=`https://api.bilibili.com/x/relation/stat?vmid=${mid}&jsonp=jsonp&callback=${cb}`;
    s.onerror=()=>fin(false); setTimeout(()=>fin(false),8000);
    document.head.appendChild(s);
  }
}
let fails=0, succ=0;

/* ---------- filters ---------- */
function matchQ(u){
  if(!state.q) return true; const q=state.q.toLowerCase();
  return u.n.toLowerCase().includes(q) || u.c.some(c=>c.toLowerCase().includes(q)) || u.w.toLowerCase().includes(q) || (u.v||[]).some(v=>v[1].toLowerCase().includes(q));
}
function filtered(){
  let r=UPS.filter(u=>state.tiers.has(u.t) && (!state.type||u.c.includes(state.type)) && (!state.hideUnv||!u.u) && matchQ(u));
  const fv=u=>(live[u.mid]&&live[u.mid].f)||u.f||0;
  if(state.sort==='fans') r.sort((a,b)=>fv(b)-fv(a));
  else if(state.sort==='rank') r.sort((a,b)=>a.i-b.i);
  else r.sort((a,b)=>a.t-b.t || fv(b)-fv(a) || a.i-b.i);
  return r;
}
function renderChips(){
  const tc=$('#tierChips'); tc.innerHTML='';
  for(const t of [1,2,3]){
    const n=UPS.filter(u=>u.t===t).length;
    const b=document.createElement('button'); b.className='chip'+(state.tiers.has(t)?' on':'');
    b.title=TIERS[t].hint;
    b.innerHTML=`<span><span class="dot" style="background:${TIERS[t].color}"></span>${TIERS[t].name}</span><span class="n">${n}</span>`;
    b.onclick=()=>{ if(state.tiers.has(t)&&state.tiers.size>1) state.tiers.delete(t); else state.tiers.add(t); persist(); render(); };
    tc.appendChild(b);
  }
  const counts={}; UPS.filter(u=>state.tiers.has(u.t)).forEach(u=>u.c.forEach(c=>counts[c]=(counts[c]||0)+1));
  const types=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const yc=$('#typeChips'); yc.innerHTML='';
  const all=document.createElement('button'); all.className='chip'+(!state.type?' on':''); all.innerHTML=`<span>全部类型</span><span class="n">${UPS.filter(u=>state.tiers.has(u.t)).length}</span>`;
  all.onclick=()=>{state.type=null;persist();render()}; yc.appendChild(all);
  if(state.type && !counts[state.type]) state.type=null;
  for(const [c,n] of types){
    const b=document.createElement('button'); b.className='chip'+(state.type===c?' on':'');
    b.innerHTML=`<span>${esc(c)}</span><span class="n">${n}</span>`;
    b.onclick=()=>{state.type=state.type===c?null:c;persist();render()}; yc.appendChild(b);
  }
  $('#sort').value=state.sort; $('#hideUnv').checked=state.hideUnv;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
  $('#side').style.visibility = state.view==='ext' ? 'hidden':'visible';
}

/* ---------- views ---------- */
function tierBadge(t){return `<span class="tier t${t}">${TIERS[t].name}</span>`}
function upCard(u){
  const nv=(u.v||[]).length;
  return `<div class="ucard">
    <div class="top"><div class="av" style="background:${grad(u.n)}">${initial(u.n)}</div>
      <div><div class="uname">${esc(u.n)}</div>
      <div class="sub">${tierBadge(u.t)}<span data-fans="${u.mid||''}">${fansHTML(u)}</span><span>#${u.i}</span></div></div></div>
    <div class="tags">${u.c.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}${u.u?'<span class="unv">分类待核实</span>':''}</div>
    <p class="why">${esc(u.w)}</p>
    <div class="acts">${nv?`<button class="btn pri" data-play="${u.i}">▶ 播放代表作 (${nv})</button>`:''}<a class="btn" href="${spaceUrl(u)}" target="_blank" rel="noopener">${u.mid?'B站主页':'B站搜索'} ↗</a></div>
  </div>`;
}
function render(){
  renderChips();
  const v=$('#view'), intro=$('#intro');
  if(state.view==='ext'){
    intro.innerHTML='不在百大名单里、但很对你口味的创作者（主要在 YouTube / 播客）。订阅数为约数。';
    const q=state.q.toLowerCase();
    const list=EXT.filter(e=>!q||(e.n+e.c.join()+e.w).toLowerCase().includes(q));
    v.innerHTML=`<h2 class="sec">站外推荐 <small>${list.length} 位</small></h2><div class="ugrid ext">${list.map(e=>`<div class="ucard">
      <div class="top"><div class="av" style="background:${grad(e.n)}">${initial(e.n)}</div><div><div class="uname">${esc(e.n)}</div>
      <div class="sub"><span>${esc(e.p)}</span><span class="fans est">${esc(e.f)}${e.f!=='—'?' 订阅':''}</span></div></div></div>
      <div class="tags">${e.c.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
      <p class="why">${esc(e.w)}</p>
      <div class="acts"><a class="btn" href="${e.url}" target="_blank" rel="noopener">去看看 ↗</a></div></div>`).join('')||'<div class="empty">没有匹配项</div>'}</div>`;
    return;
  }
  const list=filtered();
  const tierTxt=[...state.tiers].sort().map(t=>TIERS[t].name).join(' + ');
  if(state.view==='videos'){
    const vids=[]; list.forEach(u=>(u.v||[]).forEach((x,k)=>vids.push({u,bv:x[0],title:x[1],k})));
    const q=state.q.toLowerCase();
    intro.innerHTML=`点任意视频即可在页面内播放。目前筛选：<b>${esc(tierTxt)}</b>${state.type?' · <b>'+esc(state.type)+'</b>':''}。代表作只收录了与你兴趣最相关的 UP主，其余请看「百大全名单」。`;
    v.innerHTML=`<h2 class="sec">精选视频 <small>${vids.length} 集 · 来自 ${list.filter(u=>u.v).length} 位UP主</small></h2>
      <div class="vgrid">${vids.map(o=>`<button class="vcard" data-play="${o.u.i}" data-k="${o.k}">
        <div class="thumb" style="background:${grad(o.u.n+o.bv)}">${esc(o.title)}</div>
        <div class="by"><span>${esc(o.u.n)}</span><span>${esc(o.u.c[0])}</span></div></button>`).join('')||'<div class="empty">当前筛选下没有可播放的代表作——试试「强烈推荐」或在「百大全名单」里看看。</div>'}</div>`;
  } else {
    intro.innerHTML=`2025 年度百大全部 100 位，每位都标了<b>兴趣匹配度</b>和<b>内容类型</b>。左侧可多选匹配度、按类型筛选。目前：<b>${esc(tierTxt)}</b>${state.type?' · <b>'+esc(state.type)+'</b>':''}。`;
    v.innerHTML=`<h2 class="sec">百大全名单 <small>${list.length} / 100</small></h2><div class="ugrid">${list.map(upCard).join('')||'<div class="empty">没有匹配项</div>'}</div>`;
  }
  list.forEach(u=>fetchFans(u.mid));
}

/* ---------- player ---------- */
let cur=null;
function play(i,k=0){
  const u=UPS.find(x=>x.i===+i); if(!u||!u.v) return; cur={u,k:+k};
  const bv=u.v[cur.k][0];
  $('#frame').src=`https://player.bilibili.com/player.html?bvid=${bv}&autoplay=1&high_quality=1&danmaku=0`;
  $('#pWho').textContent=u.n;
  $('#pMeta').innerHTML=`${TIERS[u.t].name} · ${u.c.map(esc).join(' / ')}`;
  $('#pSpace').href=spaceUrl(u); $('#pOpen').href=`https://www.bilibili.com/video/${bv}`;
  $('#pList').innerHTML=u.v.map((x,j)=>`<li><button class="${j===cur.k?'on':''}" data-play="${u.i}" data-k="${j}">${j+1}. ${esc(x[1])}</button></li>`).join('');
  const p=$('#player'); p.classList.add('show'); p.scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-play]'); if(b){ play(b.dataset.play,b.dataset.k||0); return; }
  const t=e.target.closest('#tabs button'); if(t){ state.view=t.dataset.v; persist(); render(); window.scrollTo({top:0}); }
});
$('#pClose').onclick=()=>{ $('#frame').src='about:blank'; $('#player').classList.remove('show'); };
let qt; $('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();render()},120)});
$('#sort').onchange=e=>{state.sort=e.target.value;persist();render()};
$('#hideUnv').onchange=e=>{state.hideUnv=e.target.checked;persist();render()};
$('#mfilters').onclick=()=>$('#side').classList.toggle('open');
const th=store.get('if_theme'); if(th) document.documentElement.dataset.theme=th;
$('#theme').onclick=()=>{const dark=matchMedia('(prefers-color-scheme: dark)').matches;const curT=document.documentElement.dataset.theme||(dark?'dark':'light');const n=curT==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('if_theme',n)};
render();
})();
</script>
</body>
</html>
